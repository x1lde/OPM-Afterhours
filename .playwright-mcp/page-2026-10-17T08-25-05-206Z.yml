    - region [ref=f1e176]:
      - paragraph [ref=f1e177]: About the project
      - heading "A little room for OPM." [level=2] [ref=f1e178]
      - paragraph [ref=f1e179]: OPM Afterhours is a school music discovery project. Read artist stories, explore featured-song notes, and follow verified links to official recordings. Listen to the supplied Multo recording with the browser’s own controls.
      - paragraph [ref=f1e180]:
        - text: Artist order follows
        - link "Billboard Philippines’ first-half 2026 list" [ref=f1e181] [cursor=pointer]:
          - /url: https://billboardphilippines.com/music/news/billboard-philippines-top-opm-artists-h1-2026/
        - text: ", recorded in the original project as published July 24, 2026. This is a mid-year list, not a final full-year ranking."
      - paragraph [ref=f1e182]: Each selected song has a direct Spotify link, with verified YouTube destinations where available. Only Multo has supplied local audio and artwork; artist portraits are included throughout the directory. Local music stops when you leave its page. Platform links open in a new tab.
