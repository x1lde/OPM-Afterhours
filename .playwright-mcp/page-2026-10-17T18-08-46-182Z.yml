    - region [ref=f46e183]:
      - paragraph [ref=f46e184]: About the project
      - heading "A little room for OPM." [level=2] [ref=f46e185]
      - paragraph [ref=f46e186]: OPM Afterhours is a school music discovery project. Read artist stories, explore featured-song notes, and follow verified links to official recordings. Listen to the supplied Multo recording with the browser’s own controls.
      - paragraph [ref=f46e187]:
        - text: Artist order follows
        - link "Billboard Philippines’ first-half 2026 list" [ref=f46e188] [cursor=pointer]:
          - /url: https://billboardphilippines.com/music/news/billboard-philippines-top-opm-artists-h1-2026/
        - text: ", recorded in the original project as published July 24, 2026. This is a mid-year list, not a final full-year ranking."
      - paragraph [ref=f46e189]: Explore 30 selected songs through their cover artwork and official Spotify, Apple Music, and YouTube destinations. Multo also has a local audio player. Local music stops when you leave its page; platform links open in a new tab.
