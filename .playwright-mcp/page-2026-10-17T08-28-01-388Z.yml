        - heading "Cup of Joe" [level=1] [ref=f1e21]
        - generic [ref=f1e22]:
          - paragraph [ref=f1e23]: Cup of Joe is a pop-alternative band based in Baguio. Its line-up brings together vocalists Gian Bernardino and Raphaell Ridao, guitarists Gabriel and CJ Fernandez, and keyboardist Xen Gareza. The group’s songs combine melodic band arrangements with emotionally direct Filipino songwriting. Early releases such as Nag-Iisang Muli, Sagada, and Estranghero established a catalog that later grew into the 2023 EP Patutunguhan.
          - paragraph [ref=f1e24]: The collaboration Tingin pairs the band with Janine Teñoso, while Misteryoso highlights its work with producer Shadiel Chan. Multo first appeared as a single in 2024 before joining the 2025 debut album Silakbo, whose sequence explores stages of grief. Together, these releases offer an introduction to a band moving between intimate storytelling and expansive pop arrangements, with two lead voices at the center of its musical identity.
