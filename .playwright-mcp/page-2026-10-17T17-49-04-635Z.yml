        - region "Artist biography" [ref=e24]:
          - paragraph [ref=e25]: Arthur Nery is a Filipino singer-songwriter whose music draws on neo-soul, modern R&B, and alternative pop. His relaxed vocal delivery and slow-to-mid-tempo arrangements are central to the sound described by his label, Viva Records. The 2019 album Letters Never Sent introduced listeners to songs including Higa and Binhi, establishing a body of work built around melody, mood, and a contemporary soul approach.
          - paragraph [ref=e26]: "Pagsamo followed in 2021 and helped bring his songwriting to a wider audience. Other releases include Take All The Love, Isa Lang, and Pelikula, his collaboration with Janine Teñoso. His second album, II: The Second, arrived in 2024. These recordings show how Nery has developed a distinctive place in contemporary Filipino music through expressive singing, a measured rhythmic approach, and collaborations that extend his sound beyond solo recordings."
